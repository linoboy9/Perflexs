<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perflexs</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;background:#fff}
header{display:flex;justify-content:space-between;padding:15px 30px;background:#fff;border-bottom:1px solid #eee}
.logo{font-family:'Playfair Display';font-weight:700;letter-spacing:3px;text-decoration:none;color:#000}
.hero{
  height:85vh;
  background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1499092346589-b9b6be3e94b2?w=1920&q=80');
  background-size:cover;
  background-position:center;
  display:flex;align-items:center;justify-content:center;text-align:center;color:white;
}
.hero h1{font-family:'Playfair Display';font-size:60px;margin:0;line-height:1}
.hero p{margin:20px 0 30px;color:#eee}
.btn{background:white;color:black;padding:15px 35px;text-decoration:none;font-size:12px;letter-spacing:2px;font-weight:700}
.features{max-width:1100px;margin:60px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:0 20px}
.card{border:1px solid #eee;padding:30px}
footer{background:black;color:#666;text-align:center;padding:25px;font-size:12px;margin-top:60px}
</style>
</head>
<body>
<header>
<a href="#" class="logo">PERFLEXS</a>
<div id="reloj" style="font-size:12px;background:#f2f2f2;padding:5px 10px;border-radius:15px"></div>
</header>

<div class="hero">
<div>
<h1>Excelencia y<br>Visión Global</h1>
<p>New York • Estrategia • Negocios Internacionales</p>
<a href="#contacto" class="btn">CONTÁCTANOS</a>
</div>
</div>

<div class="features">
<div class="card"><h3>Estrategia</h3><p>Objetivos corporativos de alto nivel.</p></div>
<div class="card"><h3>Innovación</h3><p>Herramientas modernas para optimizar.</p></div>
<div class="card"><h3>Compromiso</h3><p>Seriedad y estándares profesionales.</p></div>
</div>

<div id="contacto" style="max-width:500px;margin:80px auto;padding:0 20px;text-align:center">
<h2 style="font-family:'Playfair Display'">Contacto</h2>
<input id="nombre" placeholder="Nombre" style="width:100%;padding:12px;margin:10px 0;border:1px solid #ccc">
<input id="email" placeholder="Correo" style="width:100%;padding:12px;margin:10px 0;border:1px solid #ccc">
<textarea id="mensaje" placeholder="Mensaje" style="width:100%;padding:12px;height:100px;border:1px solid #ccc"></textarea>
<button onclick="enviar()" style="width:100%;padding:15px;background:black;color:white;border:none;margin-top:10px;letter-spacing:2px">ENVIAR</button>
</div>

<footer>© 2026 PERFLEXS</footer>

<script>
setInterval(()=>{document.getElementById('reloj').innerText=new Date().toLocaleTimeString()},1000);
function enviar(){location.href=`mailto:contacto@perflexs.com?subject=Mensaje de ${nombre.value}&body=${mensaje.value} - ${email.value}`}
</script>
</body>
</html>
